<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test de Endpoints</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { margin: 10px; padding: 10px; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 3px solid #007bff; }
    </style>
</head>
<body>
    <h1>Test de Endpoints y WebSocket</h1>
    
    <button onclick="testGetDevice()">Test GET Device</button>
    <button onclick="testGetDeviceData()">Test GET Device Data</button>
    <button onclick="testToggleRele()">Test Toggle Relé</button>
    <button onclick="testWebSocket()">Test WebSocket</button>
    
    <div id="log"></div>

    <script>
        const log = (message) => {
            const logDiv = document.getElementById('log');
            logDiv.innerHTML += `<div class="log">${new Date().toLocaleTimeString()}: ${message}</div>`;
        };

        // Test GET device
        async function testGetDevice() {
            try {
                log('Testing GET device...');
                const response = await fetch('https://3b423adeb4d0.ngrok-free.app/api/Dispositivo/1/estado', {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await response.json();
                log(`GET Device Success: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`GET Device Error: ${error.message}`);
            }
        }

        // Test WebSocket
        function testWebSocket() {
            try {
                log('Testing WebSocket connection...');
                const ws = new WebSocket('wss://3b423adeb4d0.ngrok-free.app/ws/web?deviceId=1');
                
                ws.onopen = () => {
                    log('WebSocket connected successfully');
                };
                
                ws.onmessage = (event) => {
                    const data = JSON.parse(event.data);
                    log(`WebSocket message received: ${JSON.stringify(data, null, 2)}`);
                };
                
                ws.onerror = (error) => {
                    log(`WebSocket error: ${error}`);
                };
                
                ws.onclose = () => {
                    log('WebSocket connection closed');
                };
            } catch (error) {
                log(`WebSocket Error: ${error.message}`);
            }
        }

        // Test toggle relé
        async function testToggleRele() {
            try {
                log('Testing POST Canal/rele...');
                const response = await fetch('https://3b423adeb4d0.ngrok-free.app/api/Canal/rele', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true' 
                    },
                    body: JSON.stringify({ canalId: 1, releActivo: true })
                });
                const data = await response.json();
                log(`POST Rele Success: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`POST Rele Error: ${error.message}`);
            }
        }

        // Test get device data
        async function testGetDeviceData() {
            try {
                log('Testing GET device data for ID 1...');
                const response = await fetch('https://3b423adeb4d0.ngrok-free.app/api/Dispositivo/1/estado', {
                    headers: { 'ngrok-skip-browser-warning': 'true' }
                });
                const data = await response.json();
                log(`GET Device Data Success: ${JSON.stringify(data, null, 2)}`);
            } catch (error) {
                log(`GET Device Data Error: ${error.message}`);
            }
        }
    </script>
</body>
</html>
